name: CI-WORKFLOW

on:
  push:
    branches: ["master", "main", "dev"]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm install

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test
        run: echo "code is tested"

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "my code is deployed"
