name: sequential

on:
  push:
    branches: ["master", "main", "dev"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm install

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: echo "code is tested"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    steps:
      - name: Deploy
        run: echo "my code is deployed"
